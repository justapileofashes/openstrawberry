<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="OpenStrawberry">
  <title>OpenStrawberry</title>

  <defs>
    <!-- Tile: warm near-black, lit from the upper left like the app chrome. -->
    <linearGradient id="tile" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1d1a24"/>
      <stop offset="0.42" stop-color="#121016"/>
      <stop offset="1" stop-color="#08080a"/>
    </linearGradient>

    <radialGradient id="tileGlow" cx="0.12" cy="0.06" r="0.85">
      <stop offset="0" stop-color="#eef4ff" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#eef4ff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#eef4ff" stop-opacity="0"/>
    </radialGradient>

    <!-- The specular sweep that reads as glass rather than flat plastic. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.13"/>
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="0.52" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bone-to-platinum, matching the Obsidian Relay accent ramp. -->
    <linearGradient id="mark" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#fbf8f0"/>
      <stop offset="0.55" stop-color="#e8e3d5"/>
      <stop offset="1" stop-color="#b9b3a4"/>
    </linearGradient>

    <linearGradient id="markFill" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#e8e3d5" stop-opacity="0.17"/>
      <stop offset="1" stop-color="#e8e3d5" stop-opacity="0.04"/>
    </linearGradient>

    <clipPath id="tileClip">
      <rect x="52" y="52" width="920" height="920" rx="232" ry="232"/>
    </clipPath>
  </defs>

  <!-- Tile -->
  <rect x="52" y="52" width="920" height="920" rx="232" ry="232" fill="url(#tile)"/>
  <rect x="52" y="52" width="920" height="920" rx="232" ry="232" fill="url(#tileGlow)"/>
  <g clip-path="url(#tileClip)">
    <path d="M52 52 H972 V420 L52 760 Z" fill="url(#sheen)"/>
  </g>

  <!-- Rim light: bright top edge, dark bottom edge. -->
  <rect x="53.5" y="53.5" width="917" height="917" rx="230.5" ry="230.5"
        fill="none" stroke="#eef4ff" stroke-opacity="0.14" stroke-width="3"/>
  <rect x="60" y="60" width="904" height="904" rx="225" ry="225"
        fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="2"/>

  <!--
    The mark: an aperture-berry. A rounded berry silhouette whose seeds are set
    on a lens-like arc, so it reads as fruit at large sizes and as a simple
    bold glyph at 16px. Original geometry, drawn to the app's own accent ramp.
  -->
  <g transform="translate(0, 6)">
    <!--
      Calyx: three solid leaves. Solid rather than stroked so the crown survives
      at 16px, where a hairline outline would disappear into the tile.
    -->
    <g fill="url(#mark)">
      <path d="M512 286 C 494 322, 490 362, 506 400 L 518 400 C 534 362, 530 322, 512 286 Z"/>
      <path d="M498 398 C 452 358, 396 346, 356 352 C 380 396, 442 418, 494 410 Z"/>
      <path d="M526 398 C 572 358, 628 346, 668 352 C 644 396, 582 418, 530 410 Z"/>
    </g>

    <!--
      Berry body: a broad domed crown tapering to a soft point. The crown dip is
      deliberately shallow — a deep cleft reads as a heart, not a berry.
    -->
    <path d="M512 770
             C 452 764, 372 704, 340 622
             C 306 536, 318 432, 400 400
             C 440 385, 484 392, 512 408
             C 540 392, 584 385, 624 400
             C 706 432, 718 536, 684 622
             C 652 704, 572 764, 512 770 Z"
          fill="url(#markFill)"
          stroke="url(#mark)"
          stroke-width="36"
          stroke-linejoin="round"/>

    <!-- A short specular arc inside the berry, matching the tile's light. -->
    <path d="M392 500 C 404 452, 440 424, 486 418"
          fill="none"
          stroke="#ffffff"
          stroke-opacity="0.34"
          stroke-width="18"
          stroke-linecap="round"/>

    <!-- Seeds -->
    <g fill="url(#mark)">
      <circle cx="452" cy="522" r="17"/>
      <circle cx="572" cy="522" r="17"/>
      <circle cx="512" cy="588" r="17"/>
      <circle cx="452" cy="646" r="17"/>
      <circle cx="572" cy="646" r="17"/>
    </g>
  </g>
</svg>
