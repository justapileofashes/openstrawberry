name: Bug report
description: Report a reproducible problem in OpenStrawberry
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve OpenStrawberry. Do not include API keys, local paths containing private information, passwords, cookies, or session data. For security vulnerabilities, use private reporting instead of this form."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and expected result.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenStrawberry version or commit
      placeholder: "e.g. 0.1.0 or 752724f"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: ["macOS", "Windows", "Linux", "Other"]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Safe logs or screenshots
      description: Redact credentials and personally identifying information before posting.
