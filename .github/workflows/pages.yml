name: Pages

# Publishes the download page in site/ to GitHub Pages.
#
# The page ships no download URL of its own. It asks the GitHub Releases API at
# load time what has actually been published and stays disabled when the answer
# is "nothing", which is why deploying it does not enable a download affordance
# and does not touch the release gate in docs/RELEASES.md.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time. A queued run is never cancelled mid-publish, which
# would leave the site half-written.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy download page
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Only site/ is uploaded. The repository's source, docs, and any local
      # build output stay out of the published artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
